# ============================================================
# GitHub Actions workflow: Deploy Unity Catalog infrastructure
# Executes SQL via Databricks SQL Statement Execution API
# Auth: OAuth M2M (service principal client credentials)
# ============================================================

name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - test

  push:
    branches: [dev]
    paths:
      - 'infra/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  deploy-infra:
    name: Deploy UC Infra (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-latest

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------------------------------
      # Get OAuth access token
      # ---------------------------------------------------
      - name: Get OAuth access token
        run: |
          RESPONSE=$(curl -s -X POST \
            "${DATABRICKS_HOST}/oidc/v1/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials" \
            -d "client_id=${DATABRICKS_CLIENT_ID}" \
            -d "client_secret=${DATABRICKS_CLIENT_SECRET}" \
            -d "scope=all-apis")

          ACCESS_TOKEN=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])" 2>/dev/null)

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Failed to get OAuth token. Response: $RESPONSE"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"
          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV
          echo "OAuth token obtained successfully."

      # ---------------------------------------------------
      # Execute SQL setup script
      # ---------------------------------------------------
      - name: Run SQL setup
        run: |
          ENV=${{ github.event.inputs.environment || 'dev' }}
          SQL_FILE="infra/setup-${ENV}.sql"

          if [ ! -f "$SQL_FILE" ]; then
            echo "ERROR: SQL file not found: $SQL_FILE"
            exit 1
          fi

          echo "Running SQL from: $SQL_FILE"

          # Read file, remove comments and blank lines, split by semicolons
          STATEMENTS=$(sed 's/--.*$//' "$SQL_FILE" | tr '\n' ' ' | sed 's/;/;\n/g')

          echo "$STATEMENTS" | while IFS= read -r stmt; do
            # Skip empty statements
            TRIMMED=$(echo "$stmt" | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//' | sed 's/;$//')
            if [ -z "$TRIMMED" ]; then
              continue
            fi

            echo "------------------------------------------"
            echo "Executing: $TRIMMED"
            echo "------------------------------------------"

            RESPONSE=$(curl -s -X POST \
              "${DATABRICKS_HOST}/api/2.0/sql/statements" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$(python3 -c "
import json, sys
print(json.dumps({
    'warehouse_id': '${{ env.WAREHOUSE_ID }}',
    'statement': '''${TRIMMED}''',
    'wait_timeout': '30s'
}))
")")

            STATE=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',{}).get('state','UNKNOWN'))" 2>/dev/null)
            
            if [ "$STATE" = "SUCCEEDED" ]; then
              echo "SUCCESS"
            elif [ "$STATE" = "FAILED" ]; then
              ERROR=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',{}).get('error',{}).get('message','Unknown error'))" 2>/dev/null)
              echo "FAILED: $ERROR"
              exit 1
            else
              echo "WARNING: Unexpected state: $STATE"
              echo "Response: $RESPONSE"
            fi
          done

          echo "All SQL statements executed successfully."
