# ============================================================
# GitHub Actions workflow: Deploy Unity Catalog infrastructure
# Executes SQL via Databricks SQL Statement Execution API
# Auth: OAuth M2M (service principal client credentials)
# ============================================================

name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - test

  push:
    branches: [dev]
    paths:
      - 'infra/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  deploy-infra:
    name: Deploy UC Infra (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-latest

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get OAuth access token
        run: |
          RESPONSE=$(curl -s -X POST \
            "${DATABRICKS_HOST}/oidc/v1/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials" \
            -d "client_id=${DATABRICKS_CLIENT_ID}" \
            -d "client_secret=${DATABRICKS_CLIENT_SECRET}" \
            -d "scope=all-apis")

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token // empty')

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Failed to get OAuth token."
            echo "$RESPONSE" | jq .
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"
          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV
          echo "OAuth token obtained successfully."

      - name: Execute SQL setup
        run: |
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          SQL_FILE="infra/setup-${ENV}.sql"

          if [ ! -f "$SQL_FILE" ]; then
            echo "ERROR: SQL file not found: $SQL_FILE"
            exit 1
          fi

          echo "Running SQL from: $SQL_FILE"

          # Remove comments, blank lines, split by semicolons into individual statements
          sed 's/--.*$//' "$SQL_FILE" | tr '\n' ' ' | sed 's/;/;\n/g' | while IFS= read -r raw_stmt; do
            STMT=$(echo "$raw_stmt" | xargs | sed 's/;$//')
            if [ -z "$STMT" ]; then
              continue
            fi

            echo "------------------------------------------"
            echo "Executing: $STMT"
            echo "------------------------------------------"

            # Build JSON payload using jq
            PAYLOAD=$(jq -n \
              --arg wid "$WAREHOUSE_ID" \
              --arg sql "$STMT" \
              '{warehouse_id: $wid, statement: $sql, wait_timeout: "30s"}')

            RESPONSE=$(curl -s -X POST \
              "${DATABRICKS_HOST}/api/2.0/sql/statements" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")

            STATE=$(echo "$RESPONSE" | jq -r '.status.state // "UNKNOWN"')

            if [ "$STATE" = "SUCCEEDED" ]; then
              echo "SUCCESS"
            elif [ "$STATE" = "FAILED" ]; then
              ERROR=$(echo "$RESPONSE" | jq -r '.status.error.message // "Unknown error"')
              echo "FAILED: $ERROR"
              exit 1
            else
              echo "WARNING: Unexpected state: $STATE"
              echo "$RESPONSE" | jq .
            fi
          done

          echo "All SQL statements executed successfully."
