# ============================================================
# Databricks Asset Bundle configuration
# Three versions of the GH Archive pipeline:
#   V1: Plain PySpark with explicit task dependencies
#   V2: Lakeflow Pipeline with automatic dependencies (separate notebooks)
#   V3: Auto Loader Pipeline with streaming ingestion (single notebook)
# ============================================================

bundle:
  name: gharchive_pipeline

variables:
  catalog:
    description: Target Unity Catalog catalog
    default: gharchive_dev

workspace:
  host: https://dbc-67707d30-0101.cloud.databricks.com

resources:
  # ============================================================
  # VERSION 1: Plain PySpark job
  # - Dependencies: EXPLICIT (depends_on)
  # - Ingestion: Batch read, manual dedup by _source_file
  # - Gold tables: Full recompute every run
  # ============================================================
  jobs:
    gharchive_v1_pyspark:
      name: "GH Archive V1 - PySpark (Explicit Dependencies)"
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: "UTC"
        pause_status: PAUSED
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ./src/ingest/download_gharchive
            source: WORKSPACE
        - task_key: bronze
          depends_on:
            - task_key: ingest
          notebook_task:
            notebook_path: ./src/v1_pyspark/bronze
            source: WORKSPACE
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ./src/v1_pyspark/silver
            source: WORKSPACE
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./src/v1_pyspark/gold
            source: WORKSPACE

  # ============================================================
  # VERSION 2: Lakeflow Pipeline (separate notebooks)
  # - Dependencies: AUTOMATIC via dp.read()
  # - Ingestion: Batch spark.read (no streaming)
  # - Gold tables: Pipeline manages refresh
  # ============================================================
  pipelines:
    gharchive_v2_pipeline:
      name: "GH Archive V2 - Pipeline (Automatic Dependencies)"
      catalog: ${var.catalog}
      schema: v2_pipeline
      libraries:
        - notebook:
            path: ./src/v2_pipeline/bronze
        - notebook:
            path: ./src/v2_pipeline/silver
        - notebook:
            path: ./src/v2_pipeline/gold
      development: true
      channel: PREVIEW

    # ============================================================
    # VERSION 3: Auto Loader Pipeline (single notebook)
    # - Dependencies: AUTOMATIC via dp.read()
    # - Ingestion: STREAMING via cloudFiles (Auto Loader)
    #   - Only processes NEW files since last run
    #   - No manual dedup needed
    #   - Schema auto-inferred and evolved
    # - Gold tables: Pipeline manages refresh
    # ============================================================
    gharchive_v3_autoloader:
      name: "GH Archive V3 - Auto Loader (Streaming Ingestion)"
      catalog: ${var.catalog}
      schema: v3_autoloader
      libraries:
        - notebook:
            path: ./src/v3_autoloader/pipeline
      development: true
      channel: PREVIEW

  # Job wrappers to schedule pipelines
  jobs:
    gharchive_v2_scheduled:
      name: "GH Archive V2 - Scheduled Pipeline Run"
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: "UTC"
        pause_status: PAUSED
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ./src/ingest/download_gharchive
            source: WORKSPACE
        - task_key: run_pipeline
          depends_on:
            - task_key: ingest
          pipeline_task:
            pipeline_id: ${resources.pipelines.gharchive_v2_pipeline.id}
            full_refresh: false

    gharchive_v3_scheduled:
      name: "GH Archive V3 - Scheduled Auto Loader Run"
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: "UTC"
        pause_status: PAUSED
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ./src/ingest/download_gharchive
            source: WORKSPACE
        - task_key: run_pipeline
          depends_on:
            - task_key: ingest
          pipeline_task:
            pipeline_id: ${resources.pipelines.gharchive_v3_autoloader.id}
            full_refresh: false

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: gharchive_dev

  test:
    variables:
      catalog: gharchive_test
